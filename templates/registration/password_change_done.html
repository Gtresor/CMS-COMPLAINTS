{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed | RSSB CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: '#2563eb', page: '#f5f7fb' },
                    boxShadow: { soft: '0 10px 30px rgba(15, 23, 42, 0.08)', card: '0 14px 34px rgba(15, 23, 42, 0.08)' },
                    borderRadius: { '2xl': '1rem' },
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'] },
                    animation: { floatIn: 'floatIn .45s ease forwards' },
                    keyframes: { floatIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>html, body { background: #f5f7fb; }</style>
</head>
<body class="font-sans text-slate-800">
    <div class="min-h-screen flex items-center justify-center bg-page p-4">
        <div class="w-full max-w-lg bg-white rounded-2xl border border-slate-200 shadow-soft p-8 animate-floatIn text-center">
            <div class="h-16 w-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-5">
                <i class="fa-solid fa-check text-3xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Password Changed!</h1>
            <p class="text-slate-500 mb-8">Your password has been updated successfully.</p>
            <a href="{% url 'user-profile' %}" class="inline-flex items-center justify-center h-12 px-8 rounded-2xl bg-brand text-white font-bold hover:bg-blue-700 transition-all shadow-md shadow-blue-200/70">
                Back to Profile
            </a>
        </div>
    </div>
</body>
</html>
