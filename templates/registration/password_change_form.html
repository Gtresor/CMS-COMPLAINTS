{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | RSSB CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: '#2563eb', page: '#f5f7fb' },
                    boxShadow: { soft: '0 10px 30px rgba(15, 23, 42, 0.08)', card: '0 14px 34px rgba(15, 23, 42, 0.08)' },
                    borderRadius: { '2xl': '1rem' },
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'] },
                    animation: { floatIn: 'floatIn .45s ease forwards' },
                    keyframes: { floatIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>html, body { background: #f5f7fb; }</style>
</head>
<body class="font-sans text-slate-800">
    <div class="min-h-screen flex items-center justify-center bg-page p-4">
        <div class="w-full max-w-lg bg-white rounded-2xl border border-slate-200 shadow-soft p-8 animate-floatIn">
            <div class="text-center mb-8">
                <div class="h-14 w-14 rounded-2xl bg-brand/10 text-brand flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-key text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900">Change Password</h1>
                <p class="text-sm text-slate-500 mt-1">Enter your old password and a new secure password.</p>
            </div>

            {% if messages %}
                <div class="space-y-3 mb-6">
                    {% for message in messages %}
                        <div class="rounded-xl border px-4 py-3 text-sm font-semibold {% if message.tags == 'success' %}bg-emerald-50 text-emerald-700 border-emerald-200{% else %}bg-red-50 text-red-700 border-red-200{% endif %}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            {% if form.errors %}
                <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 mb-6">
                    Please correct the errors below.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="space-y-5">
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Old Password</label>
                        <div class="relative mt-1">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-lock text-sm"></i></span>
                            <input type="password" name="old_password" required class="w-full h-12 rounded-2xl border border-slate-200 pl-10 pr-4 focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">New Password</label>
                        <div class="relative mt-1">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-lock-open text-sm"></i></span>
                            <input type="password" name="new_password1" required class="w-full h-12 rounded-2xl border border-slate-200 pl-10 pr-4 focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Confirm New Password</label>
                        <div class="relative mt-1">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-check-double text-sm"></i></span>
                            <input type="password" name="new_password2" required class="w-full h-12 rounded-2xl border border-slate-200 pl-10 pr-4 focus:ring-4 focus:ring-brand/10 focus:border-brand outline-none transition-all">
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex items-center gap-3">
                    <a href="{% url 'user-profile' %}" class="h-12 flex-1 rounded-2xl border border-slate-200 flex items-center justify-center text-sm font-bold text-slate-600 hover:bg-slate-50 transition-all">Cancel</a>
                    <button type="submit" class="h-12 flex-1 rounded-2xl bg-brand text-white font-bold hover:bg-blue-700 transition-all shadow-md shadow-blue-200/70">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
